name: Sync main and github to GitHub

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  sync:
    runs-on: hiro

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Sync branches to GitHub
        shell: bash
        env:
          GH_PUSH_REPO: ${{ vars.GH_PUSH_REPO }}
          GH_PUSH_USER: ${{ vars.GH_PUSH_USER }}
          GH_PUSH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
          FJ_PUSH_REPO: ${{ vars.FJ_PUSH_REPO }}
          FJ_PUSH_USER: ${{ vars.FJ_PUSH_USER }}
          FJ_PUSH_TOKEN: ${{ secrets.FJ_PUSH_TOKEN }}
          SYNC_BOT_NAME: ${{ vars.SYNC_BOT_NAME }}
          SYNC_BOT_EMAIL: ${{ vars.SYNC_BOT_EMAIL }}
        run: node .forgejo/scripts/sync-github.mjs
