name: Retarget public PRs to github

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - edited
    branches:
      - main

permissions:
  issues: write
  pull-requests: write

jobs:
  retarget:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Move the PR base to github
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api -X PATCH "repos/$REPO/pulls/$PR_NUMBER" -f base=github >/dev/null; then
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body='Public contributions target the `github` branch, not `main`. This PR was retargeted automatically.' >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -f body='This repository accepts public contributions only against the `github` branch. Please open a new PR with `github` as the base.' >/dev/null
            gh api -X PATCH "repos/$REPO/pulls/$PR_NUMBER" -f state=closed >/dev/null
          fi
